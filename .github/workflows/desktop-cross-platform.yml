name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: win
            vgmstream: vgmstream-win.zip
            sha256: 4fa8f0f567a3636e45931b8462a04898fbceca17290a1458b80063b9558b323b
            executable: vgmstream-cli.exe
            artifact: FeedForge-Windows-x64
            files: release/*.exe
          - os: macos-15
            platform: mac
            vgmstream: vgmstream-mac.zip
            sha256: cdabf633231a4556feb0048a71990c768e862f3695dd9458ae28e4d94aa50a99
            executable: vgmstream-cli
            artifact: FeedForge-macOS-Apple-Silicon
            files: |
              release/*.dmg
              release/*.zip
          - os: ubuntu-24.04
            platform: linux
            vgmstream: vgmstream-linux.zip
            sha256: 2f98c77f756079f63fbd119939067f1ed461d77e70993bc4cc372736d859c84a
            executable: vgmstream-cli
            artifact: FeedForge-Linux-x64
            files: release/*.AppImage
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          npm ci
          python -m pip install ".[dev]"

      - name: Install macOS decoder libraries
        if: runner.os == 'macOS'
        run: brew install ffmpeg libogg libvorbis mpg123

      - name: Bundle native WEM decoder
        shell: bash
        env:
          VGMSTREAM_ARCHIVE: ${{ matrix.vgmstream }}
          VGMSTREAM_SHA256: ${{ matrix.sha256 }}
          VGMSTREAM_EXECUTABLE: ${{ matrix.executable }}
        run: |
          python - <<'PY'
          import hashlib, os, shutil, stat, urllib.request, zipfile
          from pathlib import Path

          archive = Path(os.environ["RUNNER_TEMP"]) / "vgmstream.zip"
          url = f"https://github.com/vgmstream/vgmstream/releases/download/r2117/{os.environ['VGMSTREAM_ARCHIVE']}"
          urllib.request.urlretrieve(url, archive)
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == os.environ["VGMSTREAM_SHA256"]
          destination = Path("src/feedback_converter/tools")
          destination.mkdir(parents=True, exist_ok=True)
          executable = os.environ["VGMSTREAM_EXECUTABLE"].lower()
          with zipfile.ZipFile(archive) as bundle:
              for member in bundle.infolist():
                  name = Path(member.filename).name
                  if name.lower() == executable or (os.name == "nt" and name.lower().endswith(".dll")):
                      with bundle.open(member) as source, (destination / name).open("wb") as target:
                          shutil.copyfileobj(source, target)
          tool = destination / os.environ["VGMSTREAM_EXECUTABLE"]
          assert tool.is_file()
          if os.name != "nt":
              tool.chmod(tool.stat().st_mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
          PY

      - name: Test
        run: |
          node --check electron/main.cjs
          python -m compileall -q src tools/start-demucs-server.py
          python -m pytest -q
          npm run build

      - name: Build desktop app
        run: npm run release:${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Smoke-test bundled converter
        if: runner.os != 'Windows'
        shell: bash
        run: |
          converter="$(find release -type f -path '*/bin/psarc2feedpak/psarc2feedpak' -print -quit)"
          test -n "$converter"
          chmod +x "$converter"
          expected="$(node -p "require('./package.json').version")"
          test "$("$converter" --version)" = "psarc2feedpak $expected"

      - name: Verify macOS application signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 release/mac-arm64/FeedForge.app
          decoder="$(find release/mac-arm64/FeedForge.app -type f -path '*/feedback_converter/tools/vgmstream-cli' -print -quit)"
          test -n "$decoder"
          "$decoder" -h >/dev/null

      - name: Smoke-test bundled converter
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $converter = Get-ChildItem release -Recurse -Filter psarc2feedpak.exe |
            Where-Object FullName -Match '[\\/]bin[\\/]psarc2feedpak[\\/]' |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $converter) { throw 'Bundled converter was not found.' }
          $expected = node -p "require('./package.json').version"
          if ((& $converter --version) -ne "psarc2feedpak $expected") { throw 'Bundled converter version mismatch.' }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          name: FeedForge ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
